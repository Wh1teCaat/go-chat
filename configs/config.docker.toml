[log]
path = "/app/logs/app.log"
level = "debug"

[server]
host = "0.0.0.0"
port = 8080

[database]
host = "postgres"
port = 5432
user = "postgres"
password = "postgres"
dbname = "chat_proj"
sslmode = "disable"
timezone = "Asia/Shanghai"

[jwt]
secret = "change-me-before-production"

[cors]
allowed_origins = [
  "http://localhost:3000",
  "http://localhost:5173",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:5173",
]

[redis]
enabled = true
addr = "redis:6379"
password = ""
db = 0

[rate_limit]
enabled = true
requests = 120
window_seconds = 60
