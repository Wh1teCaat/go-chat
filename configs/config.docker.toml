[log]
path = "/app/logs/app.log"
level = "debug"

[server]
host = "0.0.0.0"
port = 8080

[database]
host = "postgres"
port = 5432
user = "postgres"
password = "postgres"
dbname = "chat_proj"
sslmode = "disable"
timezone = "Asia/Shanghai"

[jwt]
secret = "change-me-before-production"

[cors]
allowed_origins = [
  "http://localhost:3000",
  "http://localhost:5173",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:5173",
]

[redis]
enabled = true
addr = "redis:6379"
password = ""
db = 0

[rate_limit]
enabled = true
requests = 120
window_seconds = 60

# 拆分部署（chat-logic + chat-gateway）配置；单体二进制忽略以下段落。
[grpc]
addr = "0.0.0.0:9090"

[gateway]
host = "0.0.0.0"
port = 8081
logic_addr = "logic:9090"

# 事件总线：logic 发布、各 gateway 实例独立消费组订阅。
# enabled=false 时退回 Redis Pub/Sub（阶段 2 形态）。
[kafka]
enabled = true
brokers = ["kafka:9092"]
topic = "chat.events"
partitions = 8
