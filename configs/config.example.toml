[log]
path = "logs/app.log"
level = "debug"

[server]
host = "0.0.0.0"
port = 8080

[database]
host = "localhost"
port = 5432
user = "postgres"
password = "change-me"
dbname = "chat_proj"
sslmode = "disable"
timezone = "Asia/Shanghai"
max_open_conns = 30

[jwt]
secret = "change-me-before-production"

[cors]
allowed_origins = [
  "http://localhost:3000",
  "http://localhost:5173",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:5173",
]

[redis]
enabled = true
addr = "127.0.0.1:6379"
password = ""
db = 0

[kafka]
enabled = false
brokers = ["127.0.0.1:9092"]
topic = "chat-messages"
group_id = "go-chat-message-writers"
client_id = "go-chat"

[rate_limit]
enabled = true
requests = 120
window_seconds = 60
