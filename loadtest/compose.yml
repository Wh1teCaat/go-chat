# Run with: docker compose -p gochat-bench -f loadtest/compose.yml up --build -d
x-backend: &backend
  build:
    context: ..
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  volumes:
    - ./config.toml:/app/configs/config.toml:ro
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
    interval: 2s
    timeout: 2s
    retries: 30
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: benchmark-only
      POSTGRES_DB: chat_benchmark
    volumes:
      - bench_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_benchmark"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 64
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - bench_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - chat-messages
      - --partitions
      - "64"
      - --replication-factor
      - "1"
  backend1:
    <<: *backend
    ports:
      - "127.0.0.1:18081:8080"
  backend2:
    <<: *backend
    # Serialize initial migrations on an empty shared database.
    depends_on:
      backend1:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:8080"
  backend3:
    <<: *backend
    depends_on:
      backend1:
        condition: service_healthy
    ports:
      - "127.0.0.1:18083:8080"
  backend4:
    <<: *backend
    depends_on:
      backend1:
        condition: service_healthy
    ports:
      - "127.0.0.1:18084:8080"
volumes:
  bench_pg:
  bench_kafka:
