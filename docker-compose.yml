services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_proj
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_proj"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: chat-redis-compose
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # 容器内使用 Docker 专用配置，避免靠环境变量覆盖数据库和 Redis 地址。
      - ./configs/config.docker.toml:/app/configs/config.toml:ro
      # 本地存储实现会把头像、聊天附件和分片临时文件放到 /app/uploads。
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  frontend:
    image: nginx:alpine
    container_name: chat-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro

volumes:
  postgres_data:
  redis_data:
