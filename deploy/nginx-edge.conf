# 入口代理：对外保持单一地址（host 8080），按路径分流到拆分后的两个服务。
# 前端不感知拆分——REST 和 WS 仍然用同一个 base URL。
#
# gateway_pool 两个关键点（排查过程见 docs/design/02-gateway-logic-split.md）：
# - zone：把负载均衡状态放进共享内存。不加时每个 worker 独立计数、都从第一个
#   上游开始，`worker_processes auto` 的多核机器上少量连接会全部落在同一副本。
# - least_conn：WebSocket 是长连接，按活跃连接数均衡比按请求数轮询更合理，
#   副本重启后也能自动把新连接引向空闲副本。
# 域名在配置加载时解析，--scale gateway=N 之后需要 `docker compose restart edge`。
upstream gateway_pool {
    zone gateway_pool 64k;
    least_conn;
    server gateway:8081;
}

upstream logic_pool {
    zone logic_pool 64k;
    server logic:8080;
}

server {
    listen 80;

    # WebSocket 接入 → gateway（可多副本，upstream 轮询分发）
    location /v1/ws {
        proxy_pass http://gateway_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 必须大于服务端 ping 周期（54s），否则空闲连接会被代理掐断。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 其余全部（REST / 文件上传下载 / 公开头像 / 健康检查）→ chat-logic
    location / {
        proxy_pass http://logic_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 放宽 body 限制以支持文件上传（分片 2MB，普通上传可能更大）。
        client_max_body_size 64m;
    }
}
