# 入口代理：对外保持单一地址（host 8080），按路径分流到拆分后的两个服务。
# 前端不感知拆分——REST 和 WS 仍然用同一个 base URL。
server {
    listen 80;

    # WebSocket 接入 → gateway
    location /v1/ws {
        proxy_pass http://gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 必须大于服务端 ping 周期（54s），否则空闲连接会被代理掐断。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 其余全部（REST / 文件上传下载 / 公开头像 / 健康检查）→ chat-logic
    location / {
        proxy_pass http://logic:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 放宽 body 限制以支持文件上传（分片 2MB，普通上传可能更大）。
        client_max_body_size 64m;
    }
}
